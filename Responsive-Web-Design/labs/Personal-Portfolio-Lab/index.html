<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav id="navbar">
        <ul class="nav-list">
            <li><a href="#welcome-section">About</a></li>
            <li><a href="#project-section">Work</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section id="welcome-section">
        <h1>Hey I am Rain</h1>
        <p class="subtitle">a CS student</p>
    </section>

    <section id="project-section">
        <h2 class="projects-header">These are some of my projects</h2>
        <div class="projects-grid">
            
            <a href="https://codepen.io/freeCodeCamp/full/zNBOeb" target="_blank" class="project project-tile">
                <img class="project-image" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute.jpg" alt="project">
                <p class="project-title">Dr. Norman Borlaug</p>
            </a>

            <a href="https://codepen.io/freeCodeCamp/full/qRwwNX" target="_blank" class="project project-tile">
                <img class="project-image" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/random-quote-machine.png" alt="project">
                <p class="project-title">Random Quote Machine</p>
            </a>

            <a href="https://codepen.io/freeCodeCamp/full/wgGVVX" target="_blank" class="project project-tile">
                <img class="project-image" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/calc.png" alt="project">
                <p class="project-title">JavaScript Calculator</p>
            </a>

        </div>
    </section>

    <section id="contact">
        <div class="contact-header">
            <h2>Let's work together...</h2>
            <p>How do you take your coffee?</p>
        </div>
        <div class="contact-links">
            <a href="https://facebook.com" target="_blank" class="contact-details"><i class="fab fa-facebook-square"></i> Facebook</a>
            <a id="profile-link" href="https://github.com/freecodecamp" target="_blank" class="contact-details"><i class="fab fa-github"></i> GitHub</a>
            <a href="https://twitter.com" target="_blank" class="contact-details"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="mailto:example@example.com" class="contact-details"><i class="fas fa-at"></i> Send a mail</a>
            <a href="tel:555-555-5555" class="contact-details"><i class="fas fa-mobile-alt"></i> Call me</a>
        </div>
    </section>

</body>
</html>
