<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900">
    <h1 class="text-yellow-400 font-bold text-3xl text-center my-2">Photography Exhibit</h1>
    <main class="main-container grid grid-cols-[1fr] lg:grid-cols-[1fr_1fr_1fr] md:grid-cols-[1fr_1fr_1fr] gap-4 m-4">

        <div
            class="card border-2 border-yellow-300 rounded-lg p-5 bg-zinc-800 text-zinc-200 ring-1 ring-yellow-300 shadow-lg shadow-yellow-200">
            <img class="rounded-md w-64 h-40 mx-auto object-cover"
                src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="colosseum">
            <span class="subheading font-bold text-2xl text-yellow-400">Colosseum</span>
            <span class="description block text-sm mb-3 text-zinc-200">There is so much history and beauty. The light
                hits it just right.</span>
            <button
                class="bg-yellow-400 text-black px-3 py-1 rounded-full hover:bg-yellow-200 mt-2 text-center cursor-pointer">Like</button>
            <button
                class="bg-black text-yellow-400 border-2 border-yellow-400 px-3 py-1 rounded-full hover:bg-yellow-400 hover:border-black hover:border-2 hover:text-black mt-2 text-center cursor-pointer">View
                Details</button>
        </div>

        <div
            class="card border-2 border-yellow-300 rounded-lg p-5 bg-zinc-800 text-zinc-200 ring-1 ring-yellow-300 shadow-lg shadow-yellow-200">
            <img class="rounded-md w-64 h-40 mx-auto object-cover"
                src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="the alps">
            <span class="subheading font-bold text-2xl text-yellow-400">The Alps</span>
            <span class="description block text-sm mb-3 text-zinc-200">The mountains go on forever and the view is
                breathtaking.</span>
            <button
                class="bg-yellow-400 text-black px-3 py-1 rounded-full hover:bg-yellow-200 mt-2 text-center cursor-pointer">Like</button>
            <button
                class="bg-black text-yellow-400 border-2 border-yellow-400 px-3 py-1 rounded-full hover:bg-yellow-400 hover:border-black hover:border-2 hover:text-black mt-2 text-center cursor-pointer">View
                Details</button>
        </div>

        <div
            class="card border-2 border-yellow-300 rounded-lg p-5 bg-zinc-800 text-zinc-200 ring-1 ring-yellow-300 shadow-lg shadow-yellow-200">
            <img class="rounded-md w-64 h-40 mx-auto object-cover"
                src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="seascape">
            <span class="subheading font-bold text-2xl text-yellow-400">Seascape</span>
            <span class="description block text-sm mb-3 text-zinc-200">The water was still, the air was cool and the
                feeling is pure peace.</span>
            <button
                class="bg-yellow-400 text-black px-3 py-1 rounded-full hover:bg-yellow-200 mt-2 text-center cursor-pointer">Like</button>
            <button
                class="bg-black text-yellow-400 border-2 border-yellow-400 px-3 py-1 rounded-full hover:bg-yellow-400 hover:border-black hover:border-2 hover:text-black mt-2 text-center cursor-pointer">View
                Details</button>
        </div>

    </main>

</body>

</html>
