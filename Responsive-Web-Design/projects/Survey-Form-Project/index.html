<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link href = "styles.css" rel = "stylesheet">
    
    
</head>
<body>
    <h1 id="title"> Survey on your Chosen University/College</h1>
    <p id="description"> This form allows us to know student's choices on which college or university they intend to go.
    </p>
    <form id="survey-form">
        <label id="name-label">Name</label>
        <input id="name" type="text" required placeholder="Enter your name">

        <label id="email-label">Email</label>
        <input id="email" type="email" required placeholder="Enter your email">

        <label id="number-label">Age</label>
        <input id="number" type="number" required min="1" max="100" placeholder="Enter your age">

        <div id = "dropdown">
            <label>Which school have you chosen to enroll to?</label>
            <select id="dropdown">
                <option> Yes</option>
                <option> No</option>
            </select>

        </div>

        <div id = 'radios'>
            <label>Tuition or No Tuition?</label>
            <input type="radio" value="tuition" name="tuition">
            <label>Tuition</label>
            <input type="radio" value="no-tuition" name="tuition">
            <label>No Tuition</label>
        </div>
       
        <div id = "checkbox">
            <label>Is your university near your home?</label>
            <input type="checkbox" value="yes">
            <label>Yes</label>
            <input type="checkbox" value="no">
            <label>No</label>
        </div>
        
        <label>What do you expect of your school?</label>
        <textarea></textarea>
        
        <input id="submit" type="submit">


    </form>



    <script src="script.js"></script>
</body>
</html>
