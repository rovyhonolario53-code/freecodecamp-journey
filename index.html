<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permutation Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <section class="generator" aria-labelledby="page-title">
            <p class="eyebrow">String utility</p>
            <h1 id="page-title">Permutation Generator</h1>
            <p class="intro">Enter a short string to see every unique arrangement of its characters.</p>

            <form id="permutation-form" class="generator-form">
                <label for="input-string">Your string</label>
                <div class="input-row">
                    <input
                        id="input-string"
                        name="input-string"
                        type="text"
                        maxlength="8"
                        placeholder="Try: abc"
                        autocomplete="off"
                        required
                    >
                    <button type="submit">Generate</button>
                </div>
                <p class="hint">Up to 8 characters</p>
            </form>

            <section class="results-section" aria-labelledby="results-title">
                <div class="results-heading">
                    <h2 id="results-title">Results</h2>
                    <span id="result-count" class="result-count">0</span>
                </div>
                <p id="status-message" class="status-message" aria-live="polite">Your permutations will appear here.</p>
                <ul id="results-list" class="results-list" aria-live="polite"></ul>
            </section>
        </section>
    </main>
</body>
</html>
