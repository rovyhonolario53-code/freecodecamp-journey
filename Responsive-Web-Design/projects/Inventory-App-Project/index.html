<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Book Inventory</h1>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Rate</th>
            </tr>
        </thead>
        <tbody>
            <tr class="read">
                <td data-label="Title">The Great Gatsby</td>
                <td data-label="Author">F. Scott Fitzgerald</td>
                <td data-label="Category">Classic</td>
                <td data-label="Status"><span class="status">Read</span></td>
                <td data-label="Rate"><span class="rate three"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="to-read">
                <td data-label="Title">1984</td>
                <td data-label="Author">George Orwell</td>
                <td data-label="Category">Dystopian</td>
                <td data-label="Status"><span class="status">To Read</span></td>
                <td data-label="Rate"><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="in-progress">
                <td data-label="Title">Dune</td>
                <td data-label="Author">Frank Herbert</td>
                <td data-label="Category">Sci-Fi</td>
                <td data-label="Status"><span class="status">In Progress</span></td>
                <td data-label="Rate"><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="read">
                <td data-label="Title">The Hobbit</td>
                <td data-label="Author">J.R.R. Tolkien</td>
                <td data-label="Category">Fantasy</td>
                <td data-label="Status"><span class="status">Read</span></td>
                <td data-label="Rate"><span class="rate two"><span></span><span></span><span></span></span></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
