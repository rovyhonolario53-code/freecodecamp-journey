<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Queens Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>N-Queens Problem Solver</h1>
        
        <div class="input-section">
            <label for="nInput">Number of Queens:</label>
            <input type="number" id="nInput" min="1" max="12" value="4">
            <button onclick="solve()">Solve</button>
        </div>

        <div id="results" class="results-section" style="display: none;">
            <h2>Solutions Found: <span id="solutionCount">0</span></h2>
            <div id="solutionsList"></div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Solving...
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function solve() {
            const n = parseInt(document.getElementById('nInput').value);
            
            if (n < 1 || n > 12) {
                alert('Please enter a number between 1 and 12');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            setTimeout(() => {
                const solutions = dfsNQueens(n);
                displayResults(solutions, n);
                document.getElementById('loading').style.display = 'none';
            }, 100);
        }

        function displayResults(solutions, n) {
            const resultsDiv = document.getElementById('results');
            const solutionsList = document.getElementById('solutionsList');
            const solutionCount = document.getElementById('solutionCount');

            solutionCount.textContent = solutions.length;
            solutionsList.innerHTML = '';

            solutions.forEach((solution, index) => {
                const boardDiv = document.createElement('div');
                boardDiv.className = 'solution';
                boardDiv.innerHTML = `<h3>Solution ${index + 1}</h3>${drawBoard(solution, n)}`;
                solutionsList.appendChild(boardDiv);
            });

            resultsDiv.style.display = 'block';
        }

        function drawBoard(solution, n) {
            let board = `<div class="board" style="grid-template-columns: repeat(${n}, 40px);">`;
            for (let row = 0; row < n; row++) {
                const col = solution[row];
                for (let c = 0; c < n; c++) {
                    const isQueen = c === col;
                    const isDark = (row + c) % 2 === 1;
                    board += `<div class="square ${isDark ? 'dark' : 'light'} ${isQueen ? 'queen' : ''}">
                        ${isQueen ? '♛' : ''}
                    </div>`;
                }
            }
            board += '</div>';
            return board;
        }
    </script>
</body>
</html>
